# Reenvío a la API. Se incluye dentro de un "location"; $backend sale de
# BACKEND_URL (ver default.conf.template). Sin ruta en proxy_pass, la petición
# llega con la misma ruta y parámetros.

proxy_pass $backend;
proxy_http_version 1.1;
# Si BACKEND_URL es https:// con un nombre, lo envía al negociar TLS (SNI).
proxy_ssl_server_name on;

proxy_set_header Host       $http_host;
proxy_set_header Connection "";

# La API confía en X-Forwarded-*: los fija este nginx y se descarta lo que mande
# el cliente (una cabecera vacía no se envía). $remote_addr ya es la IP real.
proxy_set_header X-Forwarded-For    $remote_addr;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Forwarded-Host   "";
proxy_set_header X-Forwarded-Port   "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header Forwarded          "";
proxy_set_header Proxy              "";

# La API ya envía estas cabeceras y este servidor las añade: sin duplicarlas.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;

proxy_connect_timeout 5s;
proxy_read_timeout 60s;
