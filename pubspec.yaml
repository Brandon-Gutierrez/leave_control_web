name: control_leaves_web
description: "Panel web de administración de predios y usuarios, y pantalla de QR para responsables de predio."
# Aplicación privada: no se publica en pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.11.1
  web: ^1.1.1
  qr_flutter: ^4.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - rsc/
