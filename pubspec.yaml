name: control_leaves_web
description: "Panel web de administración de predios y usuarios, y pantalla de QR para responsables de predio."
# Aplicación privada: no se publica en pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.11.1
  web: ^1.1.1
  qr_flutter: ^4.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - rsc/

  # Manrope (SIL Open Font License, ver rsc/fonts/OFL.txt): tipografía del panel.
  fonts:
    - family: Manrope
      fonts:
        - asset: rsc/fonts/Manrope_400Regular.ttf
          weight: 400
        - asset: rsc/fonts/Manrope_500Medium.ttf
          weight: 500
        - asset: rsc/fonts/Manrope_600SemiBold.ttf
          weight: 600
        - asset: rsc/fonts/Manrope_700Bold.ttf
          weight: 700
        - asset: rsc/fonts/Manrope_800ExtraBold.ttf
          weight: 800
